# The Linux desktop app (D-78). Its own workspace, so the server's builds, tests and
# image don't need WebKit or Tauri: build with `cargo build --manifest-path crates/desktop/Cargo.toml`
# after `npm run build` in web/.
[package]
name = "streamline-desktop"
version = "1.4.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Same TLS setup as the server: rustls with ring, no C toolchain.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# The local replica and outbox (9.5): the same SQLite driver as the server.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
streamline-domain = { path = "../domain" }
# "This computer only" runs the server inside the app (D-88); tests use it too.
streamline = { path = "../server" }

[dev-dependencies]
axum = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
