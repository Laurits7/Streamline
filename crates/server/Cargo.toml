[package]
name = "streamline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
streamline-domain = { path = "../domain" }
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono.workspace = true
chrono-tz.workspace = true
futures-util = { version = "0.3", default-features = false }
mime_guess = "2"
# Web Push: message encryption (RFC 8291); the VAPID token is signed with p256 directly.
p256 = { version = "0.13", features = ["ecdsa"] }
quick-xml = "0.42"
rand = "0.8"
# CalDAV client: rustls with the ring provider (no C toolchain needed for cross builds).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "compression-br", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
utoipa = "5"
ulid = "1"
web-push-native = { version = "0.5", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
