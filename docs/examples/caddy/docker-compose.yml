# Streamline behind Caddy with HTTPS. Copy this folder next to your checkout (or adjust
# `build.context`), put your hostname in the Caddyfile, then: docker compose up -d
#
# With a public domain, Caddy gets a Let's Encrypt certificate automatically. For a LAN-only
# name, `tls internal` uses Caddy's own CA (trust it on your devices, or accept the warning).
services:
  streamline:
    build: ../../..
    image: streamline:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      TRUST_PROXY: "true"   # trust Caddy's X-Forwarded-Proto/Host: secure cookies over HTTPS

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [streamline]

volumes:
  caddy_data:
