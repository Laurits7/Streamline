<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Streamline focus</title>
    <link rel="stylesheet" href="/desktop-focus.css" />
    <script src="/desktop-focus.js" defer></script>
  </head>
  <!-- The desktop app's timer on every monitor (D-82): a small corner countdown or full screen. -->
  <body>
    <main>
      <div class="label" id="label"></div>
      <div class="time" id="time"></div>
      <div class="task" id="task"></div>
      <button id="hide" type="button">Hide until the next interval (Esc)</button>
    </main>
  </body>
</html>
