name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- web/src/lib/api/types

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # D-76: the initial route (index.html and what it loads) stays under 150 KB gzip;
      # everything, lazy views included, under the spec's 300 KB.
      - name: Bundle budget (initial 150 KB, all 300 KB gzip)
        run: |
          initial=$(grep -o '/assets/[^"]*' dist/index.html | sed 's|^/|dist/|' | xargs cat dist/index.html | gzip -9 | wc -c)
          total=$(cat dist/index.html dist/assets/*.js dist/assets/*.css | gzip -9 | wc -c)
          echo "initial route: $initial bytes gzip; all assets: $total bytes gzip"
          test "$initial" -lt 153600
          test "$total" -lt 307200

  # Multi-arch image (amd64 + arm64 via QEMU). Pull requests only build it, which
  # verifies the arm64 build; main and version tags also publish it to GHCR.
  image:
    runs-on: ubuntu-latest
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/streamline
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
