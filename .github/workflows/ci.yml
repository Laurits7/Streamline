name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Runners are pinned to Ubuntu 24.04 rather than ubuntu-latest (which moves to Ubuntu 26
# from 2026-10-19): the desktop app's .deb has to install on 24.04, and a release
# shouldn't change runner under us. Move all jobs together when it's time.
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- web/src/lib/api/types

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # D-76: the initial route (index.html and what it loads) stays under 150 KB gzip;
      # everything, lazy views included, under the spec's 300 KB.
      - name: Bundle budget (initial 150 KB, all 300 KB gzip)
        run: |
          initial=$(grep -o '/assets/[^"]*' dist/index.html | sed 's|^/|dist/|' | xargs cat dist/index.html | gzip -9 | wc -c)
          total=$(cat dist/index.html dist/assets/*.js dist/assets/*.css | gzip -9 | wc -c)
          echo "initial route: $initial bytes gzip; all assets: $total bytes gzip"
          test "$initial" -lt 153600
          test "$total" -lt 307200

  # The Linux desktop app (D-78): its own Cargo workspace, with WebKitGTK.
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/desktop
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: cargo fmt --check --manifest-path crates/desktop/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path crates/desktop/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path crates/desktop/Cargo.toml
      - run: desktop-file-validate packaging/linux/streamline-desktop.desktop

  # Multi-arch image (amd64 + arm64 via QEMU). Pull requests only build it, which
  # verifies the arm64 build; main and version tags also publish it to GHCR.
  image:
    runs-on: ubuntu-24.04
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/streamline
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
