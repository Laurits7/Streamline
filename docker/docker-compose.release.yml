# Streamline __VERSION__ — prebuilt image for amd64 and arm64 (e.g. a Raspberry Pi).
# Put this file in an empty directory, then: docker compose up -d
# Open http://<server-ip>:3000; on the first visit you create the admin account.
# All data lives in ./data next to this file. To update, change the version in `image:`
# (make a backup first), then: docker compose pull && docker compose up -d
services:
  streamline:
    image: __IMAGE__:__VERSION__
    container_name: streamline
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      LOG_LEVEL: info
      # Optional: create the first admin automatically (otherwise the web UI asks on first visit).
      # INITIAL_ADMIN_USER: admin
      # INITIAL_ADMIN_PASSWORD: change-me-please
      # Behind an HTTPS reverse proxy (Caddy, Traefik, Tailscale serve), trust its X-Forwarded-* headers:
      # TRUST_PROXY: "true"
      # More settings: https://github.com/__REPO__#configuration
