services:
  streamline:
    # Builds from source. To use the prebuilt image instead (amd64 and arm64, e.g. a
    # Raspberry Pi), remove `build:` and set `image: ghcr.io/laurits7/streamline:latest`.
    build:
      context: .
      # On a low-memory device, uncomment to reduce RAM needed while compiling:
      # args:
      #   LTO: thin
      #   CODEGEN_UNITS: "16"
    image: streamline:latest
    container_name: streamline
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      LOG_LEVEL: info
      # Optional: create the first admin automatically (otherwise the web UI asks on first visit).
      # INITIAL_ADMIN_USER: admin
      # INITIAL_ADMIN_PASSWORD: change-me-please
      # Behind an HTTPS reverse proxy (Caddy, Traefik, Tailscale serve), trust its X-Forwarded-* headers:
      # TRUST_PROXY: "true"
