site_name: Streamline
site_description: A self-hosted todo list and day planner for a household.
site_url: https://laurits7.github.io/Streamline/
repo_url: https://github.com/Laurits7/Streamline
repo_name: Laurits7/Streamline
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

theme:
  name: material
  icon:
    logo: material/calendar-check
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Home: index.md
  - Features: features.md
  - Getting started:
      - Install: getting-started/install.md
      - Configuration: getting-started/configuration.md
      - HTTPS, phone app and notifications: getting-started/https.md
      - Backups and updates: getting-started/backups-and-updates.md
      - Desktop app (Linux): getting-started/desktop.md
  - Guides:
      - Sharing with other servers: guides/sharing.md
      - Calendar, GitHub and other integrations: guides/integrations.md
      - Security: guides/security.md
  - Reference:
      - API: api.md
  - Development:
      - Developing: development/index.md
      - Releasing: development/releasing.md
  - Project:
      - Specification: SPEC.md
      - Work plan: WORKPLAN.md
      - Decisions: DECISIONS.md
      - Changelog: changelog.md

# The changelog lives at the repository root; docs/changelog.md includes it.
watch:
  - CHANGELOG.md
